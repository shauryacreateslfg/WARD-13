<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>St. Maren's Hospital - Patient Intake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#edeae0] text-[#1a1a1a] min-h-screen" id="body">
    <div id="ov-scanlines" class="scanlines fixed inset-0 pointer-events-none" styles="z-index:900"></div>
    <div id="ov-vignette" class="vignette-normal fixed inset-0 pointer-events-none transition-all duration-[1200ms]" style="z-index:901"></div>
    <div id="ov-blood" class="fixed inset-0 pointer-events-none opacity-0 bg-[#4a0000]" style="z-index: 902; transition:opacity 0.07s"></div>
    <div id="ov-white" class="fixed inset-0 pointer-events-none opacity-0 bg-white" style="z-index: 903; transition:opacity 0.04s"></div>

    <div id="shadow" class="fixed bottom-0 pointer-events-none select-none opacity-0" style="right:-140px; z-index:800; transition:opacity 0.8s ease, right 1.4s ease-in;">
        <pre class="text-[#080808] leading-[1.1] text-[0.52rem] drop-shadow-[0_0_px_rgba (0,0,0,0,95)]">
             ██
 ████
  ██
 █  █
 █  █
██  ██
█    █
█    █
 █  █
  ██
        </pre>
    </div>

    <div id="glitch-bar" class="fixed left-0 right-0 opacity-0 pointer-events-none" style="height:3px; background: rgba(180,255,180,0.35); top:30%; z-index:950;"></div>
    <div id="pg-landing" class="min-h-screen flex flex-col">
        <div class="bg-[#1e3a1e text-[#9ec49e] px-6 py-1.5 flex justify-between items-center]"
    </div>
</body>
</html>
